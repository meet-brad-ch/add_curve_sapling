# Runs the gate (python tools/check.py) on Windows, where the golden files are valid, and builds the extension
# zip with Blender's own packer. A push of a tag vX.Y.Z (the manifest version) also publishes a GitHub Release with
# the zip. A manual run (Actions > Build extension > Run workflow) builds the zip as a run artifact only.
name: Build extension

on:
  push:
    branches: ["main", "revamp-5.2", "gn-tree"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.2"
  # blender-5.2.2.sha256, the same on the three mirrors below
  BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"
  BLENDER_SHA256_WINDOWS: "3849d17a682cba006075aaa3f3597ecb5c9c30ec31035b2e092c53e40679b535"
  # download.blender.org answers scripts with a Cloudflare challenge; Blender's official mirrors do not
  BLENDER_MIRRORS: >-
    https://mirrors.ocf.berkeley.edu/blender/release/Blender5.2
    https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2
    https://mirror.clarkson.edu/blender/release/Blender5.2

jobs:
  check:
    # the golden files hash exact float32 values of Blender 5.2.2 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the development tools
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements-dev.txt

      - name: Download Blender
        shell: bash
        run: |
          cd "$RUNNER_TEMP"  # outside the checkout: the gate lints and formats every Python file in it
          file="blender-$BLENDER_VERSION-windows-x64.zip"
          for mirror in $BLENDER_MIRRORS; do
            if curl -fsSL --retry 3 -o "$file" "$mirror/$file"; then break; fi
            echo "::warning::$mirror failed"
          done
          echo "$BLENDER_SHA256_WINDOWS  $file" | sha256sum -c -
          7z x -bd "$file" > /dev/null
          echo "BLENDER=$(cygpath -w "$PWD")\\blender-$BLENDER_VERSION-windows-x64\\blender.exe" >> "$GITHUB_ENV"

      - name: Gate (lint, format, types, manifest, tests with coverage)
        shell: bash
        run: python tools/check.py

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' source/blender_manifest.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the manifest version v$version"
            exit 1
          fi

      - name: Download Blender
        run: |
          file="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          for mirror in $BLENDER_MIRRORS; do
            if curl -fsSL --retry 3 -o "$file" "$mirror/$file"; then break; fi
            echo "::warning::$mirror failed"
          done
          echo "$BLENDER_SHA256  $file" | sha256sum -c -
          tar -xf "$file"
          echo "BLENDER=$PWD/blender-$BLENDER_VERSION-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Install the libraries Blender loads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libice6 libsm6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1

      - name: Validate and build
        run: |
          "$BLENDER" --factory-startup -c extension validate source
          mkdir dist
          "$BLENDER" --factory-startup -c extension build --source-dir source --output-dir dist
          (cd dist && sha256sum -- *.zip > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: sapling_tree_gen
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "Sapling Tree Gen $GITHUB_REF_NAME" \
            --notes "For Blender 5.2 LTS. Install: Edit > Preferences > Get Extensions > Install from Disk, then select the zip. Changes: CHANGELOG.md. Built from $GITHUB_SHA."
