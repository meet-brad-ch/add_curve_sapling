# Lint and format configuration: `ruff check .` and `ruff format --check .`
# (run both, plus validation and tests, with `python tools/check.py`).

[tool.ruff]
target-version = "py313"  # Blender 5.2 bundles Python 3.13.
line-length = 120
# Built-in presets are data files (one dict literal each).
extend-exclude = ["source/presets", "tools/vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C901", "D1", "ANN"]
# Long if/else assignments read better than one-line ternaries. The class docstring documents
# __init__, magic methods need none, and Any is right where Blender passes "an object with these
# properties" (the operator or a namespace).
ignore = ["SIM108", "D105", "D107", "ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Docstrings and annotations are required in the add-on, not in tests and tools.
# Test methods (D102) keep their sentence names as their documentation (owner 2026-11-03); every other test and
# tool definition has a docstring.
"tests/*" = ["N802", "D102", "ANN"]
"tools/*" = ["ANN"]
# Operator property names are the public operator API and the preset keys, so they stay camelCase.
"source/ui/properties.py" = ["N815"]

[tool.mypy]
python_version = "3.13"  # Blender 5.2 bundles Python 3.13.
files = ["source", "tests", "tools"]
exclude = ["source/presets/", "tools/vulture_whitelist.py"]
mypy_path = ["tests", "tools"]
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Every function of the add-on has a typed signature.
module = ["source.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Blender declares operator properties as annotations (seed: IntProperty(...)), which are not types.
module = ["source.ui.properties", "source.ui.operators", "source.ui.preset_save"]
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
# Tests reach into generated objects: the stubs type context.scene as Optional and object.data as a
# union of every data type; the operator bpy.ops.curve.tree_add only exists once the add-on runs.
module = [
    "bench_in_blender", "render_presets_in_blender", "render_listing_in_blender", "render_settings_in_blender", "capture_panel_in_blender", "setting_effect_probe_in_blender", "run",
    "support.*", "requirements.*", "unit.*",
]
disable_error_code = ["union-attr", "attr-defined"]
